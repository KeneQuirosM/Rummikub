# Render Blueprint: Dashboard -> New -> Blueprint -> este repo
services:
  - type: web
    name: rummi3d
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: CORS_ORIGINS
        sync: false
      # Cuentas (opcional): ver README → "Cuentas"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
