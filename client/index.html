<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f0e" />
    <meta name="description" content="Rummy de fichas en 3D para jugar 1 vs 1 con un amigo desde el celular. Sin instalar nada." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="Rummi 3D" />
    <meta property="og:description" content="¡Juguemos Rummi 3D! Fichas, mesa y un amigo." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Rummi 3D</title>
    <style>
      /* Estilos críticos de la pantalla de carga (antes de que llegue el CSS) */
      html,body{margin:0;height:100%;background:#0b0f0e;color:#f4ead2;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:100;background:radial-gradient(ellipse at center,#14302a 0%,#0b0f0e 70%);transition:opacity .5s}
      #loading.done{opacity:0;pointer-events:none}
      .ld-logo{font-size:44px;font-weight:800;letter-spacing:.02em;color:#f2c75c;text-shadow:0 4px 24px rgba(242,199,92,.35)}
      .ld-bar{width:200px;height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
      .ld-bar i{display:block;height:100%;width:5%;background:linear-gradient(90deg,#c9962e,#f2c75c);transition:width .3s}
    </style>
  </head>
  <body>
    <div id="loading" role="status" aria-live="polite">
      <div class="ld-logo">Rummi 3D</div>
      <div class="ld-bar"><i id="ld-progress"></i></div>
      <div id="ld-text" style="opacity:.7;font-size:14px">Cargando…</div>
    </div>

    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="vignette"></div>

    <!-- MENÚ PRINCIPAL -->
    <section id="menu" class="screen" hidden>
      <button id="profile-chip" class="profile-chip" data-i18n-title="menu.editProfile">
        <span class="avatar" id="menu-avatar">🦊</span><span id="menu-name">Jugador</span>
      </button>
      <div class="menu-hero">
        <h1 class="logo">Rummi <span>3D</span></h1>
        <p class="tagline" data-i18n="app.tagline"></p>
      </div>
      <nav class="menu-list">
        <button class="btn btn-gold btn-lg" id="btn-create"><span class="ico">👥</span><span data-i18n="menu.playFriend"></span></button>
        <button class="btn btn-lg" id="btn-join"><span class="ico">🔑</span><span data-i18n="menu.join"></span></button>
        <button class="btn btn-lg" id="btn-practice"><span class="ico">🤖</span><span data-i18n="menu.practice"></span></button>
        <div class="menu-row three">
          <button class="btn btn-col" id="btn-stats"><span class="ico">📊</span><span data-i18n="menu.stats"></span></button>
          <button class="btn btn-col" id="btn-settings"><span class="ico">⚙️</span><span data-i18n="menu.settings"></span></button>
          <button class="btn btn-col" id="btn-howto"><span class="ico">📖</span><span data-i18n="menu.howto"></span></button>
        </div>
      </nav>
    </section>

    <!-- SALA DE ESPERA -->
    <section id="lobby" class="screen" hidden>
      <div class="card lobby-card">
        <p class="muted" data-i18n="room.code"></p>
        <div class="room-code" id="lobby-code">ABCD</div>
        <ul class="lobby-players" id="lobby-players"></ul>
        <p class="waiting"><span class="dots"></span> <span id="lobby-status" data-i18n="room.waiting"></span></p>
        <button class="btn btn-gold btn-lg" id="btn-start" hidden></button>
        <button class="btn btn-whatsapp btn-lg" id="btn-share"><span class="ico">💬</span><span data-i18n="room.share"></span></button>
        <button class="btn" id="btn-copy"><span class="ico">🔗</span><span data-i18n="room.copy"></span></button>
        <button class="btn btn-ghost" id="btn-lobby-leave" data-i18n="room.leave"></button>
      </div>
    </section>

    <!-- HUD DE PARTIDA -->
    <section id="hud" hidden>
      <header class="hud-top">
        <button class="icon-btn" id="btn-menu" data-i18n-title="btn.menu">☰</button>
        <div class="opps" id="opps"></div>
        <div class="turn" id="turn">
          <svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15.5" class="ring-bg"/><circle cx="18" cy="18" r="15.5" class="ring-fg" id="ring-fg"/></svg>
          <span class="turn-time" id="turn-time">60</span>
        </div>
      </header>
      <div class="turn-label" id="turn-label"></div>
      <div class="opening" id="opening" hidden></div>
      <div class="side-tools">
        <button class="icon-btn" id="btn-recenter" data-i18n-title="btn.recenter">⌖</button>
        <button class="icon-btn" id="btn-mute" data-i18n-title="btn.sound">🔊</button>
      </div>
      <div class="side-tools right">
        <div class="pool" data-i18n-title="hud.pool"><span class="pool-ico">🀫</span><span id="pool-count">78</span></div>
        <button class="icon-btn" id="btn-emote" data-i18n-title="btn.emote">😀</button>
        <button class="icon-btn" id="btn-chat" data-i18n-title="btn.chat">💬<i class="badge" id="chat-badge" hidden></i></button>
      </div>
      <div class="actions" id="actions">
        <button class="act" id="act-undo"><span class="ico">↶</span><span data-i18n="btn.undo"></span></button>
        <button class="act" id="act-sort"><span class="ico">⇅</span><span id="sort-label" data-i18n="btn.sortColor"></span></button>
        <button class="act" id="act-draw"><span class="ico">＋</span><span data-i18n="btn.draw"></span></button>
        <button class="act act-primary" id="act-end"><span class="ico">✓</span><span data-i18n="btn.endTurn"></span></button>
      </div>
      <button class="rack-arrow left" id="rack-left" aria-label="◀">‹</button>
      <button class="rack-arrow right" id="rack-right" aria-label="▶">›</button>
      <div class="emote-picker" id="emote-picker" hidden></div>
      <div class="chat" id="chat" hidden>
        <div class="chat-log" id="chat-log"></div>
        <form class="chat-form" id="chat-form">
          <input id="chat-input" maxlength="140" autocomplete="off" data-i18n-ph="chat.placeholder" />
          <button class="btn btn-gold" data-i18n="chat.send"></button>
        </form>
      </div>
      <div class="floaters" id="floaters"></div>
    </section>

    <div id="modal-root"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="banner" class="banner" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
